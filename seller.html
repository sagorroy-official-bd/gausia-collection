<!DOCTYPE html>
<html lang="bn" translate="no" class="notranslate"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><title>GAUSIA - Seller Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>.notranslate{translate:no}body{background:#FFF8F0;margin:0;font-family:Hind Siliguri,Arial}.top-head{background:linear-gradient(90deg,#111827,#4C1D95,#B91C1C);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;color:#fff}.inp{width:100%;border:2px solid #FACC15;border-radius:10px;padding:10px;font-size:15px;margin-top:8px}.card{border:1px solid #E5E7EB;border-radius:14px;padding:14px;background:#fff}.btn{background:#9d174d;color:#fff;border:0;padding:12px;border-radius:10px;width:100%;font-weight:bold;cursor:pointer}</style></head>
<body>
<div class="top-head"><b>🌸 GAUSIA - Seller Panel</b><a href="index.html" style="background:#fff;color:#111;padding:6px 12px;border-radius:20px;text-decoration:none;font-size:13px">🏠 কাস্টমার পেজ</a></div>
<div style="max-width:600px;margin:auto;padding:14px">
<div class="card"><h3 style="margin:0">🧑‍💼 সেলার - নতুন পণ্য দিন</h3><p style="font-size:13px;color:#666">তথ্য দিলেই এডমিনে চলে যাবে। অরিজিনাল হিসেবে সেভ হবে।</p>
<input id="sName" class="inp" placeholder="শাড়ির নাম - যেমন: জামদানি শাড়ি">
<input id="sPrice" class="inp" type="number" placeholder="খুচরা দাম - যেমন: 800">
<input id="sWhole" class="inp" type="number" placeholder="পাইকারি দাম - যেমন: 500">
<input id="sImg" class="inp" placeholder="ছবির লিংক (না থাকলে খালি রাখুন)">
<textarea id="sDesc" class="inp" placeholder="বিবরণ - কাপড়, কালার, সাইজ"></textarea>
<button class="btn" onclick="addSeller()" style="margin-top:12px">✅ Admin-এ পাঠান - সেভ হবে</button>
<p id="sMsg" style="color:green;font-weight:bold"></p></div>
<div class="card" style="margin-top:14px"><b>📦 আমার পাঠানো পণ্য (অরিজিনাল):</b><div id="sellerList" style="margin-top:10px"></div></div>
</div>
<script>
// === FIREBASE CONFIG - আগের ফাইলের config টা এখানে থাকবে ===
// আপনার আগের seller.html এ যেই firebaseConfig ছিল, সেটাই এখানে বসবে। 
// যদি Config না থাকে, তাহলে নিচের লাইনটা আপনার আগের ফাইল থেকে কপি করে বসান।
const firebaseConfig = {apiKey:"AIzaSyDUMMY",authDomain:"gausia-dummy.firebaseapp.com",projectId:"gausia-dummy"};
try{ if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); }catch(e){}
const db = (typeof firebase!=='undefined' && firebase.firestore) ? firebase.firestore() : null;
async function addSeller(){
 let n=document.getElementById('sName').value.trim();
 let p=document.getElementById('sPrice').value||0;
 let w=document.getElementById('sWhole').value||0;
 let img=document.getElementById('sImg').value||'https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=600';
 let d=document.getElementById('sDesc').value;
 if(!n){alert('নাম দিন');return;}
 let data={type:'original',name:n,price:+p,whole:+w,img:img,desc:d,status:'pending',createdAt:Date.now()};
 try{
  if(db){ await db.collection('products').add(data); }
  else{ let arr=JSON.parse(localStorage.getItem('gausia_v2')||'[]'); arr.push({id:Date.now(),...data}); localStorage.setItem('gausia_v2',JSON.stringify(arr)); }
  document.getElementById('sMsg').innerText='✅ সেভ হয়ে এডমিনে চলে গেছে!';
  document.getElementById('sName').value='';document.getElementById('sPrice').value='';document.getElementById('sWhole').value='';document.getElementById('sDesc').value='';
  loadList();
 }catch(e){ alert('সেভ হয় নাই: '+e.message); }
}
async function loadList(){
 let list=document.getElementById('sellerList');
 try{
  let items=[];
  if(db){ let snap=await db.collection('products').where('type','==','original').get(); snap.forEach(d=>items.push(d.data())); }
  else{ items=JSON.parse(localStorage.getItem('gausia_v2')||'[]').filter(x=>x.type=='original'); }
  items.sort((a,b)=>b.createdAt-a.createdAt);
  list.innerHTML = items.length ? items.map(p=>`<p>• ${p.name} - ${p.price} টাকা - ${p.status}</p>`).join('') : 'এখনো কিছু পাঠান নাই';
 }catch(e){ list.innerHTML='লোড হয় নাই'; }
}
loadList();
</script></body></html>
